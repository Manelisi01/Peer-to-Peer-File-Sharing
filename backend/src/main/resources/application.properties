spring.application.name=peer-to-peer-file-sharing
server.port=8080
# The HTTP API and UI are for this machine only. Peers connect to the seeding port, not to this.
server.address=127.0.0.1
# Show the real reason in API errors (e.g. "File not found") instead of a generic message.
server.error.include-message=always
spring.servlet.multipart.max-file-size=300GB
spring.servlet.multipart.max-request-size=300GB
p2p.storage-dir=./data
p2p.keep-downloads=false
p2p.download-ttl-minutes=30
p2p.chunk-size=524288
# Desktop app only (set by the app at launch, leave empty/false otherwise):
#   p2p.api-token                 shared secret the window must send with every /api request
#   p2p.allow-path-sharing        share files from where they are (requires p2p.api-token)
#   p2p.exit-on-stdin-close       exit when the desktop app that started this process goes away
p2p.api-token=
p2p.allow-path-sharing=false
p2p.exit-on-stdin-close=false
p2p.tracker.enabled=true
p2p.tracker.udp-port=5000
p2p.tracker.peer-timeout-ms=60000
p2p.tracker.cleanup-interval-ms=5000
p2p.tracker.heartbeat-ms=30000

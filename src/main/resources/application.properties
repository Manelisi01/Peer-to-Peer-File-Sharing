spring.application.name=peer-to-peer-file-sharing
server.port=8080
spring.servlet.multipart.max-file-size=10GB
spring.servlet.multipart.max-request-size=10GB
p2p.storage-dir=./data
p2p.chunk-size=524288
p2p.tracker.enabled=true
p2p.tracker.udp-port=5000
p2p.tracker.peer-timeout-ms=60000
p2p.tracker.cleanup-interval-ms=5000
p2p.tracker.heartbeat-ms=30000